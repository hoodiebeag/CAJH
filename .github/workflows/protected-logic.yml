# Runs the protected-logic check where it cannot be skipped.
#
# WHY. The check was built to run from a local pre-commit hook, and a local hook lives in
# .git/, which is not version controlled. A fresh clone, a new container or a cloud session
# starts with no hook and no sign anything is missing. Measured 2026-09-24: one such container
# had an empty hooks directory and every commit made in it went unchecked for weeks. A guard
# that vanishes when the repository is copied is not a guard.
#
# PER COMMIT, NOT PER BRANCH -- and this is the whole design, learned by getting it wrong.
# The first version diffed the cumulative range. On a pull request that means the entire branch
# against its base, which includes every prose mention of the protected functions added since
# the branch started: design documents, a protocol, a broker interface note. None of them touch
# the logic; all of them discuss it. That diff never shrinks, so the check would have been
# permanently red, and a check that is always red gets ignored exactly like one that never runs.
#
# Checking each commit on its own reproduces the local hook's semantics precisely: the same
# commit, the same diff, the same verdict, whether it was made on a laptop or in a container.
#
# PUSH ONLY. Every commit reaching a pull request was pushed first, so push coverage is complete
# for this repository's workflow. Adding pull_request as well would re-examine the branch's whole
# history on every update, which is the failure described above.
#
# THE SCRIPT RUNS UNMODIFIED. It reads the staged diff, so rather than teach it a second way to
# find its input -- and risk the CI path drifting from the local one, or quietly becoming weaker
# -- each commit is staged with `git reset --soft` and the script sees what it always sees. One
# implementation, two callers. This also sidesteps a catch-22: the script contains the pattern
# literals, so editing it trips its own check.
#
# NO OVERRIDE HERE, DELIBERATELY. The local check has a single-use, human-created, ten-minute
# marker for the rare legitimate case. It lives in .git/ and cannot exist in a fresh checkout,
# which is correct: a CI bypass -- a label, a magic trailer -- would recreate the skippable-guard
# problem this exists to close. A change that genuinely must touch the protected code gets a
# human with merge rights approving it through branch protection: a person outside the check,
# not a flag inside it.
name: protected-logic

on: push

jobs:
  protected-logic:
    name: protected-logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check each pushed commit on its own
        run: |
          set -uo pipefail
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # A new branch, or a force-push whose old tip is gone. Fall back to the commits this
            # branch has that the default branch does not, rather than to the whole of history.
            git fetch --no-tags --quiet origin "${{ github.event.repository.default_branch }}" || true
            RANGE="$(git merge-base HEAD FETCH_HEAD 2>/dev/null || echo '')..HEAD"
            [ "$RANGE" = "..HEAD" ] && RANGE="HEAD~1..HEAD"
          else
            RANGE="$BEFORE..HEAD"
          fi
          echo "checking commits in $RANGE"

          FAILED=0
          for SHA in $(git rev-list --reverse "$RANGE"); do
            if ! git rev-parse --verify --quiet "$SHA^" >/dev/null; then
              echo "skipping root commit $SHA"
              continue
            fi
            git checkout --quiet --detach "$SHA"
            git reset --quiet --soft "$SHA^"
            if node scripts/check-protected-logic.cjs; then
              echo "ok   $(git log -1 --format='%h %s' "$SHA")"
            else
              echo "FAIL $(git log -1 --format='%h %s' "$SHA")"
              FAILED=1
            fi
          done
          exit "$FAILED"
