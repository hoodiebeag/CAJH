# Runs the protected-logic check where it cannot be skipped.
#
# WHY. The check was built to run from a local pre-commit hook, and a local hook lives
# in .git/, which is not version controlled. A fresh clone, a new container or a cloud
# session therefore starts with no hook and no sign that anything is missing. Measured
# on 2026-09-24: one such container had an empty hooks directory and every commit made
# in it went unchecked for weeks. A guard that silently vanishes when the repository is
# copied is not a guard.
#
# This does not replace the local hook, which is worth having because it fails in
# seconds instead of after a push. It replaces trusting the local hook.
#
# THE SCRIPT IS RUN UNMODIFIED, on purpose. It reads the STAGED diff, so rather than
# teach it a second way to find its input -- and risk the two drifting, or the CI path
# quietly becoming weaker than the local one -- the workflow stages the range under
# review with `git reset --soft` and lets the script see exactly what it always sees.
# The safety logic has one implementation and both callers exercise it.
#
# THERE IS DELIBERATELY NO OVERRIDE HERE. The local check has a single-use,
# human-created, ten-minute marker for the rare legitimate case. That marker lives in
# .git/ and cannot exist in a fresh CI checkout, which is the correct outcome: adding a
# CI bypass -- a label, a magic commit trailer -- would recreate exactly the
# skippable-guard problem this workflow exists to close. If a change genuinely must
# touch the protected code, a human with merge rights approves it through branch
# protection, which is a decision made by a person outside this check rather than a
# flag inside it.
name: protected-logic

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the check needs history to diff against a base

      - name: Work out what to diff against
        id: base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            # A brand-new branch reports an all-zero "before". Falling back to the root
            # commit would present the entire repository as one diff and flag every
            # historical mention, so compare against the default branch instead.
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              git fetch --no-tags origin "${{ github.event.repository.default_branch }}" || true
              BASE="$(git merge-base HEAD FETCH_HEAD 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)"
            fi
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "diffing against $BASE"

      - name: Stage the range so the check sees its usual input
        run: git reset --soft "${{ steps.base.outputs.base }}"

      - name: Protected-logic check
        run: node scripts/check-protected-logic.cjs
